name: npm publish

env:
  DEBUG: napi:*
  APP_NAME: fs-storage-native
  MACOSX_DEPLOYMENT_TARGET: "10.13"

permissions:
  contents: read
  id-token: write # Required for OIDC trusted publishing.

on:
  # Dispatch only. This is the single workflow configured in npm OIDC trusted
  # publishing, and it is invoked by the release orchestrators (manual_release_node.yaml
  # and on_master.yaml) via apify/actions/execute-workflow. It expects the version in
  # package.json at `ref` to already be set.
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to publish (branch, tag, or commit SHA)
        required: true
        type: string
      tag:
        description: npm dist-tag
        required: true
        type: choice
        default: latest
        options:
          - latest
          - next

jobs:
  build:
    name: Build - ${{ matrix.settings.target }}
    defaults:
      run:
        working-directory: crawlee-storage-node
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            build: npm run build -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            build: npm run build -- --target aarch64-unknown-linux-gnu
          # The musl builds run inside plain Alpine node containers, natively
          # on each architecture's runner, with the stable Rust toolchain
          # installed at build time (the napi-rs builder images are stale —
          # their Node is too old for napi CLI v3). RUSTFLAGS=-C
          # target-feature=-crt-static is required for cdylibs on musl.
          # CARGO_HOME is pointed at /usr/local/cargo so the cache mounts in
          # the "Build in Docker" step apply. Paths are relative to the repo
          # root (the /build mount), and npm ci runs inside the container so
          # platform-specific optional deps (oxfmt, oxlint) resolve for musl.
          - host: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            docker: node:22-alpine
            build: |-
              set -e
              apk add --no-cache build-base curl
              export RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="/usr/local/cargo/bin:$PATH"
              export RUSTFLAGS="-C target-feature=-crt-static"
              cd crawlee-storage-node
              npm ci
              npm run build -- --target x86_64-unknown-linux-musl
          - host: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            docker: node:22-alpine
            build: |-
              set -e
              apk add --no-cache build-base curl
              export RUSTUP_HOME=/usr/local/rustup CARGO_HOME=/usr/local/cargo
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
              export PATH="/usr/local/cargo/bin:$PATH"
              export RUSTFLAGS="-C target-feature=-crt-static"
              # napi defaults the linker to the cross-toolchain name
              # aarch64-linux-musl-gcc; in a native arm64 Alpine container the
              # right linker is plain gcc.
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc
              cd crawlee-storage-node
              npm ci
              npm run build -- --target aarch64-unknown-linux-musl
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: npm run build -- --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: npm run build -- --target aarch64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Rust
        if: ${{ !matrix.settings.docker }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            crawlee-storage-node/target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}

      - name: Install dependencies
        if: ${{ !matrix.settings.docker }}
        run: npm ci

      - name: Build
        if: ${{ !matrix.settings.docker }}
        shell: bash
        run: ${{ matrix.settings.build }}

      # The host cargo cache dirs are mounted into the image's CARGO_HOME so
      # the "Cache cargo" step covers Docker builds too.
      - name: Build in Docker
        if: ${{ matrix.settings.docker }}
        working-directory: .
        env:
          BUILD_SCRIPT: ${{ matrix.settings.build }}
        run: |
          docker run --rm --user 0:0 \
            -v "$HOME/.cargo/git/db:/usr/local/cargo/git/db" \
            -v "$HOME/.cargo/registry/cache:/usr/local/cargo/registry/cache" \
            -v "$HOME/.cargo/registry/index:/usr/local/cargo/registry/index" \
            -v "$GITHUB_WORKSPACE:/build" \
            -w /build \
            "${{ matrix.settings.docker }}" \
            sh -c "$BUILD_SCRIPT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: crawlee-storage-node/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawlee-storage-node
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Move artifacts
        run: npm run artifacts

      - name: List packages
        run: ls -R ./npm
        shell: bash

      # Tack on a `-beta.N` suffix for prerelease publishes. The upstream
      # git-cliff-release action emits bare versions (e.g. 0.1.5) for
      # `release_type: prerelease`, so we patch the version here right before
      # publishing. The committed package.json keeps the bare version.
      # See .github/scripts/before-beta-release.js for the gory details.
      - name: Bump prerelease version
        if: ${{ inputs.tag == 'next' }}
        run: |
          node ../.github/scripts/before-beta-release.js
          npm run copy-version

      - name: Publish to npm
        run: npm publish --access public --provenance --tag ${{ inputs.tag }}
